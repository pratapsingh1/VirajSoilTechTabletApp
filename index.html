<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <meta
    name="theme-color"
    content="#071f17"
  />

  <title>Viraj SoilTech | Product Advisor</title>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>

  <div id="app"></div>

  <div
    id="modal"
    class="modal"
    aria-hidden="true"
  >
    <div class="modal-backdrop" onclick="closeModal()"></div>

    <div class="modal-card">

      <button
        class="modal-close"
        onclick="closeModal()"
        aria-label="Close"
      >
        ×
      </button>

      <div id="modalContent"></div>

    </div>
  </div>

  <script src="app.js"></script>

</body>
</html>
